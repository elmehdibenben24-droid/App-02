<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelance Rate Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 rounded-xl p-6 shadow-xl">
    <h1 class="text-2xl font-bold text-center mb-6 text-emerald-400">Freelance Rate Calculator</h1>
    
    <label class="block text-sm mb-1 text-slate-300">Monthly Expenses ($)</label>
    <input type="number" id="exp" value="800" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 mb-4 text-white focus:outline-none focus:border-emerald-500">

    <label class="block text-sm mb-1 text-slate-300">Target Monthly Profit ($)</label>
    <input type="number" id="sav" value="1200" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 mb-4 text-white focus:outline-none focus:border-emerald-500">

    <button onclick="calc()" class="w-full bg-emerald-500 hover:bg-emerald-600 transition text-slate-900 font-bold py-3 rounded-lg mb-6">Calculate My Rate</button>

    <div class="grid grid-cols-2 gap-4 text-center border-t border-slate-700 pt-4">
      <div class="bg-slate-900 p-3 rounded-lg border border-slate-700/50">
        <p class="text-xs text-slate-400">Min. Hourly Rate</p>
        <p id="hr" class="text-2xl font-bold text-emerald-400 mt-1">--</p>
      </div>
      <div class="bg-slate-900 p-3 rounded-lg border border-slate-700/50">
        <p class="text-xs text-slate-400">Min. Daily Rate</p>
        <p id="dr" class="text-2xl font-bold text-white mt-1">--</p>
      </div>
    </div>
    
    <p class="text-xs text-slate-500 mt-6 text-center">💡 Includes a 20% buffer for taxes & unexpected costs.</p>
  </div>

  <script>
    function calc() {
      let total = (Number(document.getElementById('exp').value) + Number(document.getElementById('sav').value)) * 1.20;
      let hr = total / 108; // Assuming 108 billable hours per month
      let dr = hr * 5; // Assuming 5 billable hours per day
      document.getElementById('hr').innerText = '$' + Math.ceil(hr);
      document.getElementById('dr').innerText = '$' + Math.ceil(dr);
    }
    // Calculate automatically on load
    calc();
  </script>
</body>
</html>
